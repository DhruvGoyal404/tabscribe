name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # An explicit bash shell runs with -eo pipefail.
    shell: bash

env:
  NPM_VERSION: 11.21.0
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use pinned npm
        run: npm install -g "npm@${NPM_VERSION}"
      - run: npm ci
      - name: Release-age check (>= 14 days)
        run: npm run check:release-age
      - name: Playwright image matches @playwright/test
        run: npm run check:playwright-image
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Production build has the approved permissions and CSP, and no dev-only files
        run: npm run check:dist
      # Builds the dev-only ASR bench (dist-bench/) to catch breakage. No model is downloaded.
      - run: npm run build:bench
      - name: Upload extension (artifact downloads as a zip of dist/)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tabscribe-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Official Playwright image with the browsers and their system packages preinstalled, so the
    # job skips the apt install. The tag must match @playwright/test exactly (a mismatch fails with
    # a missing browser executable); bump both together. Pinned by digest.
    # --user 1001 matches the runner's uid so the workspace and tool cache stay writable;
    # --ipc=host and --init follow https://playwright.dev/docs/docker.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --user 1001 --ipc=host --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use pinned npm
        run: npm install -g "npm@${NPM_VERSION}"
      - run: npm ci
      # The `chromium` channel runs extensions in new headless mode, so no xvfb is needed:
      # https://playwright.dev/docs/chrome-extensions
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          set -o pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}" gitleaks
      - name: Scan full history
        run: '"${RUNNER_TEMP}/gitleaks" git --redact --verbose --exit-code 1 .'
