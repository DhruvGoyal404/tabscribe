<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tabscribe</title>
    <link rel="stylesheet" href="../shared/page.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <h1>Tabscribe</h1>
    <p id="status" class="status" role="status" aria-live="polite">Loading…</p>

    <div class="meter-row">
      <meter
        id="meter"
        min="-60"
        max="0"
        low="-18"
        high="-6"
        optimum="-30"
        value="-60"
        aria-label="Tab audio level"
      ></meter>
      <span id="level" class="level">– dBFS</span>
    </div>

    <div class="actions">
      <button id="start" type="button" disabled>Start</button>
      <button id="stop" type="button" disabled>Stop</button>
    </div>

    <p id="error" class="error" role="alert" hidden></p>
    <p id="version" class="version"></p>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
